apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilight
  labels:
    app.kubernetes.io/name: twilight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: twilight
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twilight
    spec:
      containers:
      - name: twilight
        image: twilight-web
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: twilight-secret
            optional: false
        livenessProbe:
          httpGet:
            path: /health/live
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
