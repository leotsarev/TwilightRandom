apiVersion: apps/v1
kind: Deployment
metadata:
  name: twilight
  labels:
    app.kubernetes.io/name: twilight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: twilight
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: twilight
    spec:
      containers:
        - name: twilight
          image: twilight-web
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: ConnectionStrings__TwilightDb
              valueFrom:
                secretKeyRef:
                  name: twilight-conn
                  key: CONNECTIONSTRINGS__TWILIGHTDB
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
