apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: twilight
spec:
  hostnames:
    - twilight.tsarevs.ru
  parentRefs:
    - name: main
      namespace: infra
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: twilight
          port: 80
