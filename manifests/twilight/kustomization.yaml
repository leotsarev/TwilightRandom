apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: twilight

resources:
- ../base

# Нужно для `kubectl apply --prune -l managed-by-kustomize=true` в CI:
# так CI отличает ресурсы, которыми управляет, от всего остального в namespace.
labels:
- includeSelectors: true
  pairs:
    managed-by-kustomize: "true"

# CI (deploy-common.yml) дописывает сюда при деплое:
#   secretGenerator: (с реальными значениями из GitHub Secrets, behavior: replace)
#   images: (registry+repo+digest вместо плейсхолдеров twilight-web/twilight-migrator)
