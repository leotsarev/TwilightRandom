name: Build and publish

on:
  pull_request:
  merge_group:
    branches:
      - master
  push:
    branches:
      - master
    tags:
      - v**
  workflow_dispatch:

env:
  APP_PROJECT: ./Twilight.Web/Twilight.Web.csproj
  MIGRATOR_PROJECT: ./Twilight.Migrator/Twilight.Migrator.csproj

  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      checks: write
      actions: write
      statuses: write

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Fetch the whole repo history

    # TODO: Make GitHub Action from this script
    - name: Git Version  # Fills env.CALCULATED_VERSION and env.CALCULATED_VERSION_IS_RELEASE
      id: version
      run:  iex ((New-Object System.Net.WebClient).DownloadString('https://raw.githubusercontent.com/AntonSmolkov/HandyPoshScripts/v1.0.2/DevOps/SemVerCalc_GitHubFlow_Actions.ps1'))
      shell: pwsh
      env:
        REF_NAME: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v6.0.0
      with:
        global-json-file: global.json

    - name: Restore nuget dependencies cache
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        # Look to see if there is a cache hit for the corresponding requirements file
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
        restore-keys: |
          ${{ runner.os }}-nuget

 #temporary disable docker cache
 #   - name: Restore docker images cache
 #     uses: satackey/action-docker-layer-caching@v0.0.11
 #     continue-on-error: true

    - name: Restore
      run: dotnet restore

    - name: Format
      run: dotnet format --no-restore --verify-no-changes --severity error

    - name: Build portal
      run: dotnet build -c Release -r linux-x64 --property:Version=${{ env.CALCULATED_VERSION }}  ${APP_PROJECT}

    - name: Build migrator
      run: dotnet build -c Release -r linux-x64 --property:Version=${{ env.CALCULATED_VERSION }}  ${MIGRATOR_PROJECT}

    - name: Test
      run: dotnet test -c Release --logger trx --results-directory ./TestResults

    - name: Save test results to artifacts
      uses: actions/upload-artifact@v7  # upload test results
      if: success() || failure()        # run this step even if previous step failed
      with:
        name: test-results
        path: TestResults

    #Rest of the pipeline implies write api privileges and can't be run on PRs

    - name: Log in to Selectel Container Registry
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      id: login-cr
      uses: docker/login-action@v3
      with:
        registry: cr.selcloud.ru
        username: ${{ secrets.SELECTEL_CR_USERNAME }}
        password: ${{ secrets.SELECTEL_CR_PASSWORD }}

    # TODO: убрать, когда деплой переедет на Selectel
    - name: Log in to Yandex Container Registry
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      id: login-yandex-cr
      uses: yc-actions/yc-cr-login@v3
      with:
        yc-sa-json-credentials: ${{ secrets.YANDEX_CR_SA_KEY_JSON }}

    # SDK собирает образы в локальный docker, а пушит docker push: при прямом пуше из SDK
    # Selectel возвращает в Location внутренний адрес (*.craas-service.svc) и загрузка слоёв падает.
    - name: Build portal image
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      run: dotnet publish --os linux --arch x64 -c Release --no-build /t:PublishContainer ${APP_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    - name: Build migrator image
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      run: dotnet publish --os linux --arch x64 -c Release --no-build /t:PublishContainer ${MIGRATOR_PROJECT} -p:Version=${{ env.CALCULATED_VERSION }}

    # Теги те же, что ставит SDK: ContainerImageTags в Directory.Build.props
    - name: Push images to Selectel
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      env:
        TARGET_PREFIX: cr.selcloud.ru/joinrpg
        IMAGE_NAMES: twilight-web twilight-migrator
      run: |
        set -euo pipefail
        for name in ${IMAGE_NAMES}; do
          for tag in latest ${{ env.CALCULATED_VERSION }}; do
            docker tag joinrpg/${name}:${tag} ${TARGET_PREFIX}/${name}:${tag}
            docker push --quiet ${TARGET_PREFIX}/${name}:${tag}
          done
        done

    # TODO: убрать, когда деплой переедет на Selectel
    - name: Push images to Yandex
      if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
      env:
        TARGET_PREFIX: cr.yandex/crpais914lemf2m60cja
        IMAGE_NAMES: twilight-web twilight-migrator
      run: |
        set -euo pipefail
        for name in ${IMAGE_NAMES}; do
          for tag in latest ${{ env.CALCULATED_VERSION }}; do
            docker tag joinrpg/${name}:${tag} ${TARGET_PREFIX}/${name}:${tag}
            docker push --quiet ${TARGET_PREFIX}/${name}:${tag}
          done
        done